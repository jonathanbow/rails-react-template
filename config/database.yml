# PostgreSQL. Configure via DATABASE_URL, or DB_HOST / DB_USER / DB_PASSWORD.
default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV["DB_HOST"] %>
  username: <%= ENV["DB_USER"] %>
  password: <%= ENV["DB_PASSWORD"] %>

development:
  <<: *default
  database: rails_react_template_development

test:
  <<: *default
  database: rails_react_template_test

production:
  primary:
    <<: *default
    database: rails_react_template_production
  cache:
    <<: *default
    database: rails_react_template_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: rails_react_template_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: rails_react_template_production_cable
    migrations_paths: db/cable_migrate
